<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <!-- No es bloqueja el zoom: la persona pot ampliar la pantalla amb els dits (WCAG 1.4.4). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B4F8F">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Recorda'm">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Recorda'm</title>
  <link rel="icon" type="image/svg+xml" href="icones/logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png">
  <link rel="stylesheet" href="css/estils.css">
</head>
<body>
  <header class="capcalera">
    <div class="capcalera-dins">
      <a id="btn-inici" class="boto boto-capcalera" href="#inici">
        <span class="icona" data-icona="enrere" aria-hidden="true"></span>
        <span data-t="inici">Inici</span>
      </a>
      <span id="marca" class="marca">
        <img class="logo-icona" src="icones/logo.svg" alt="" width="40" height="40">
        <span class="logo-text">Recorda'm</span>
      </span>
      <button id="btn-ajustos" class="boto boto-capcalera" type="button" aria-haspopup="dialog">
        <span class="icona" data-icona="ajustos" aria-hidden="true"></span>
        <span data-t="ajustos">Ajustos</span>
      </button>
    </div>
  </header>

  <div id="avis-emmagatzematge" class="avis-sistema" hidden></div>

  <main id="contingut" class="contenidor" tabindex="-1">
    <noscript>
      <p>Recorda'm necessita JavaScript per funcionar. / Recorda'm necesita JavaScript para funcionar.</p>
    </noscript>
  </main>

  <!-- Zona que llegeixen els lectors de pantalla quan hi ha un missatge nou. -->
  <div id="anunci" class="visualment-amagat" aria-live="polite" aria-atomic="true"></div>

  <!-- Finestra: confirmar abans d'esborrar -->
  <dialog id="dlg-confirmar" class="finestra" aria-labelledby="confirmar-titol" aria-describedby="confirmar-text">
    <h2 id="confirmar-titol"></h2>
    <p id="confirmar-text"></p>
    <div class="botons-finestra">
      <button type="button" class="boto boto-perill" id="confirmar-si"></button>
      <button type="button" class="boto boto-secundari" id="confirmar-no"></button>
    </div>
  </dialog>

  <!-- Finestra: confirmar que una tasca està feta -->
  <dialog id="dlg-fet" class="finestra" aria-labelledby="fet-titol" aria-describedby="fet-text">
    <h2 id="fet-titol"></h2>
    <p id="fet-text"></p>
    <div class="botons-finestra">
      <button type="button" class="boto boto-principal" id="fet-si"></button>
      <button type="button" class="boto boto-secundari" id="fet-no"></button>
    </div>
  </dialog>

  <!-- Finestra: treure un recordatori (no esborra res, només l'avís) -->
  <dialog id="dlg-treure" class="finestra" aria-labelledby="treure-titol" aria-describedby="treure-text">
    <h2 id="treure-titol"></h2>
    <p id="treure-text"></p>
    <div class="botons-finestra">
      <button type="button" class="boto boto-principal" id="treure-una"></button>
      <button type="button" class="boto boto-secundari" id="treure-totes"></button>
      <button type="button" class="boto boto-secundari" id="treure-no"></button>
    </div>
  </dialog>

  <!-- Finestra: ajustos -->
  <dialog id="dlg-ajustos" class="finestra" aria-labelledby="ajustos-titol">
    <div id="ajustos-contingut"></div>
  </dialog>

  <!-- Finestra: avís (recordatori) -->
  <dialog id="dlg-avis" class="finestra finestra-avis" role="alertdialog" aria-labelledby="avis-titol" aria-describedby="avis-cos">
    <div id="avis-contingut"></div>
  </dialog>

  <script src="js/textos.js"></script>
  <script src="js/dades.js"></script>
  <script src="js/recordatoris.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
